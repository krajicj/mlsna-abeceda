# All toolchain commands run here – see CLAUDE.md › Commands.
name: mlsna-abeceda # project name (and volume prefix) independent of the directory name
x-toolchain: &toolchain
  build:
    context: .
    target: toolchain # the small image; `media` (ffmpeg) is only for the voice services
  image: mlsna-abeceda-toolchain
  user: node
  working_dir: /app
  init: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - pnpm-store:/app/.pnpm-store # pnpm puts the store next to the project (HOME is on another device)
  depends_on:
    init:
      condition: service_completed_successfully

services:
  # Named volumes are created root-owned; hand them to user `node`. Idempotent.
  init:
    build:
      context: .
      target: toolchain
    image: mlsna-abeceda-toolchain
    user: root
    network_mode: none
    volumes:
      - node_modules:/app/node_modules
      - pnpm-store:/app/.pnpm-store # pnpm puts the store next to the project (HOME is on another device)
    command: chown node:node /app/node_modules /app/.pnpm-store

  # Services under the `cli` profile are never started by `--profile dev up`; `docker compose run`
  # enables a profile automatically for the service it targets.
  install: # internet access (registry); first time without a lockfile: `run --rm install pnpm install`
    <<: *toolchain
    profiles: [cli]
    command: pnpm install --frozen-lockfile

  add: # internet access; usage: docker compose run --rm add -D <pkg>@<exact-version>
    <<: *toolchain
    profiles: [cli]
    entrypoint: ['pnpm', 'add']

  fonts: # internet access; one-off: downloads Fredoka into public/fonts/ and writes src/fonts.css
    <<: *toolchain
    profiles: [cli]
    command: node scripts/fetch-fonts.mjs

  voice: # internet (ElevenLabs); the key comes from outside the repository, see CLAUDE.md rule 9
    <<: *toolchain
    build:
      context: .
      target: media # ffmpeg: every generated clip goes through the loudness pass
    image: mlsna-abeceda-media
    profiles: [cli]
    env_file:
      - path: elevenlabs.env # gitignored symlink to ~/.config/mlsna-abeceda/elevenlabs.env
        # Without the file the service still starts, so `--dry-run` runs where there is no key.
        # (A missing env_file is an error only for the service that declares it – `docker compose
        # config` and the other services are unaffected.)
        required: false
    entrypoint: ['node', '--disable-warning=ExperimentalWarning', 'scripts/generate-voice.mjs']

  normalize: # re-gain the committed clips; needs no key and no network, only ffmpeg
    <<: *toolchain
    build:
      context: .
      target: media
    image: mlsna-abeceda-media
    profiles: [cli]
    network_mode: none
    entrypoint:
      ['node', '--disable-warning=ExperimentalWarning', 'scripts/generate-voice.mjs', '--normalize']

  sfx: # internet (ElevenLabs Sound Effects); the same key and the same rules as `voice`
    <<: *toolchain
    build:
      context: .
      target: media # ffmpeg: every generated clip goes through the loudness pass
    image: mlsna-abeceda-media
    profiles: [cli]
    env_file:
      - path: elevenlabs.env # gitignored symlink to ~/.config/mlsna-abeceda/elevenlabs.env
        required: false # so `--dry-run` runs where there is no key, see the note at `voice`
    entrypoint: ['node', '--disable-warning=ExperimentalWarning', 'scripts/generate-sfx.mjs']

  normalize-sfx: # re-gain the committed effects; needs no key and no network, only ffmpeg
    <<: *toolchain
    build:
      context: .
      target: media
    image: mlsna-abeceda-media
    profiles: [cli]
    network_mode: none
    entrypoint:
      ['node', '--disable-warning=ExperimentalWarning', 'scripts/generate-sfx.mjs', '--normalize']

  vite: # dev server on an internal network – no DNS, no egress
    <<: *toolchain
    profiles: [dev]
    networks: [isolated]
    environment:
      VITE_POLL: ${VITE_POLL:-0}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    command: pnpm dev

  dev: # publishes the dev server to the host: http://localhost:5173/mlsna-abeceda/
    image: alpine/socat@sha256:3d9e7966201dd3a065df591020a09fd3c70845de7e7086e3531ea69db774406b
    profiles: [dev]
    user: '65534:65534'
    cap_drop: [ALL]
    read_only: true
    networks: [default, isolated]
    ports: ['127.0.0.1:5173:5173']
    command: TCP-LISTEN:5173,fork,reuseaddr TCP:vite:5173
    depends_on: [vite]

  test:
    <<: *toolchain
    profiles: [cli]
    network_mode: none
    command: pnpm test

  check:
    <<: *toolchain
    profiles: [cli]
    network_mode: none
    command: pnpm check

  build:
    <<: *toolchain
    profiles: [cli]
    network_mode: none
    command: pnpm build

networks:
  isolated:
    internal: true

volumes:
  node_modules:
  pnpm-store:
